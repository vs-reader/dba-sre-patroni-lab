---
cluster_name: demo
pg_port: 5432
patroni_api_port: 8008
etcd_install: true

cluster_packages:
  - name: postgresql-17
    version: "17.11-0+deb13u1"
  - name: postgresql-client-17
    version: "17.11-0+deb13u1"
  - name: libpq5
    version: "17.11-0+deb13u1"
  - name: patroni
    version: "4.0.7-3~deb13u1"
  - name: python3-etcd
    version: "0.4.5-6"
  - name: etcd-server
    version: "3.5.16-4"
  - name: etcd-client
    version: "3.5.16-4"

prometheus_version: "2.53.3+ds1-2"
grafana_version: "13.2.4"
grafana_deb_url: "https://github.com/grafana/grafana/releases/download/v13.2.4/grafana_13.2.4_38252365904_linux_amd64.deb"
grafana_deb_sha256: "f32ba4e166e35a376f39cbeb8dd47c57f7bf608b09339cb41adf6d39082af3c5"

postgresql_parameters:
  log_min_duration_statement: -1

grafana_url: "http://{{ hostvars[groups['monitoring'][0]].ansible_host }}:3000"
grafana_http_addr: "{{ hostvars[groups['monitoring'][0]].ansible_host }}"
grafana_token: "{{ lookup('ansible.builtin.file', 'credentials/grafana-token', errors='ignore') | default('', true) }}"
git_commit: "{{ lookup('ansible.builtin.pipe', 'git describe --always --dirty 2>/dev/null || echo none') }}"
